<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="auth"><main class="auth-card"><h1>لوحة طلبات الصيانة</h1><p>تسجيل الدخول</p><form method="post">{{ form.hidden_tag() }}<label>{{form.username.label}}{{form.username()}}</label><label>{{form.password.label}}{{form.password()}}</label><button>دخول</button></form>{% for category,msg in get_flashed_messages(with_categories=true) %}<div class="flash {{category}}">{{msg}}</div>{% endfor %}</main></body></html>
