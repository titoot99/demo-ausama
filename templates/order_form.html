<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><main class="container narrow"><h1>{{title}}</h1><form class="card" method="post">{{form.hidden_tag()}}<label>{{form.title.label}}{{form.title()}}</label><label>{{form.address.label}}{{form.address()}}</label><label>{{form.description.label}}{{form.description(rows=5)}}</label><label>{{form.priority.label}}{{form.priority()}}</label><label>{{form.status.label}}{{form.status()}}</label><div class="actions"><button>حفظ</button><a class="button secondary" href="{{url_for('dashboard')}}">إلغاء</a></div></form></main></body></html>
